name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-check:
    name: Build, test, lint and Docker check
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Crear archivo .env para CI
        run: |
          cat > .env <<'EOF'
          PORT=3000
          CLIENT_URL=http://localhost
          JWT_SECRET=ci_jwt_secret_para_validacion_automatica_123456789

          DATABASE_URL=postgresql://admin:admin123@postgres:5432/sistema_pedidos
          POSTGRES_DB=sistema_pedidos
          POSTGRES_USER=admin
          POSTGRES_PASSWORD=admin123

          MINIO_ENDPOINT=minio
          MINIO_PORT=9000
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadmin123
          MINIO_BUCKET_PRODUCTOS=productos
          MINIO_USE_SSL=false
          MINIO_PUBLIC_URL=/media
          MINIO_PUBLIC_READ=true

          VITE_API_URL=/api
          VITE_MINIO_PUBLIC_URL=/media
          VITE_MINIO_BUCKET_PRODUCTOS=productos
          SEED_DEMO_PASSWORD=clave-demo-ci
          EOF

      - name: Validar Docker Compose
        run: docker compose --env-file .env config

      - name: Validar Docker Compose de producción
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env config

      - name: Instalar dependencias backend
        working-directory: backend
        run: npm ci

      - name: Generar Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Revisar backend con ESLint
        working-directory: backend
        run: npm run lint

      - name: Ejecutar tests backend
        working-directory: backend
        run: npm run test

      - name: Compilar backend
        working-directory: backend
        run: npm run build

      - name: Auditar dependencias de producción backend
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm ci

      - name: Revisar frontend con ESLint
        working-directory: frontend
        run: npm run lint

      - name: Ejecutar tests frontend
        working-directory: frontend
        run: npm run test

      - name: Compilar frontend
        working-directory: frontend
        run: npm run build

      - name: Auditar dependencias de producción frontend
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Revisar formato con Prettier
        working-directory: backend
        run: npm exec prettier -- ../ --check

      - name: Levantar aplicación para pruebas accesibles
        run: |
          docker compose --profile tools run --rm --build seed
          docker compose up -d --build --wait

      - name: Instalar Chromium para Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Ejecutar auditoría accesible en navegador
        working-directory: frontend
        env:
          E2E_DEMO_PASSWORD: clave-demo-ci
        run: npm run test:e2e:a11y

      - name: Mostrar logs si falla la auditoría
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Guardar evidencia de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore

      - name: Detener aplicación de CI
        if: always()
        run: docker compose down --volumes
